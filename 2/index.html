<!DOCTYPE html>
<html>
<head>
  <title>Practical 2</title>
</head>
<body>
  <h2>Multiplication Table</h2>
  Enter number: <input type="number" id="num" value="5"><br><br>
  <button onclick="table()">Show Table</button>
  <p id="result"></p>

  <script>
    function table() {
      var n = Number(document.getElementById('num').value);
      var output = '';

      for (var i = 1; i <= 10; i++) {
        output += n + ' * ' + i + ' = ' + (n * i) + '<br>';
      }

      document.getElementById('result').innerHTML = output;
    }
  </script>
</body>
</html>
