<!DOCTYPE html>
<html>
<head>
  <title>Practical 7.2</title>
</head>
<body>
  <h2>Splice Example</h2>
  <button onclick="addItem()">Add Item</button>
  <p id="result"></p>

  <script>
    var list = ['HTML', 'CSS', 'JavaScript'];

    function addItem() {
      list.splice(2, 0, 'Angular', 'SQL');
      document.getElementById('result').innerHTML = list;
    }
  </script>
</body>
</html>
