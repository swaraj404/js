<!DOCTYPE html>
<html>
<head>
  <title>Practical 6.3</title>
</head>
<body>
  <h2>Check Value in Array</h2>
  <script>
    var arr = ['you', 'will', 'learn', 'javascript'];
    var result = arr.includes('javascript');

    if (result) {
      document.write('Array contains a value');
    } else {
      document.write('Array does not contain a value');
    }
  </script>
</body>
</html>
