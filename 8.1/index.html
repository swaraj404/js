<!DOCTYPE html>
<html>
<head>
  <title>Practical 8.1</title>
</head>
<body>
  <h1 onmouseover="changeColor1()" onmouseout="changeColor2()">Move mouse here</h1>

  <script>
    function changeColor1() {
      document.body.style.backgroundColor = 'red';
    }

    function changeColor2() {
      document.body.style.backgroundColor = 'yellow';
    }
  </script>
</body>
</html>
