<!DOCTYPE html>
<html>
<head>
  <title>Practical 1</title>
</head>
<body>
  <h2>Area Calculator</h2>
  Base: <input type="number" id="base" value="10"><br><br>
  Height: <input type="number" id="height" value="5"><br><br>
  Radius: <input type="number" id="radius" value="7"><br><br>
  <button onclick="calculate()">Calculate</button>
  <p id="result"></p>

  <script>
    function calculate() {
      var base = Number(document.getElementById('base').value);
      var height = Number(document.getElementById('height').value);
      var radius = Number(document.getElementById('radius').value);

      var triangle = (base * height) / 2;
      var rectangle = base * height;
      var circle = 3.14 * radius * radius;

      document.getElementById('result').innerHTML =
        'Triangle: ' + triangle + '<br>' +
        'Rectangle: ' + rectangle + '<br>' +
        'Circle: ' + circle;
    }
  </script>
</body>
</html>
