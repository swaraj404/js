<!DOCTYPE html>
<html>
<head>
  <title>Practical 9</title>
</head>
<body>
  <h2>Student Form</h2>
  <form name="myForm" onsubmit="return validate()">
    First Name: <input type="text" name="fname"><br><br>
    Last Name: <input type="text" name="lname"><br><br>
    Password: <input type="password" name="usrpassword"><br><br>
    Mobile: <input type="text" name="usrmobile"><br><br>
    <input type="submit" value="Submit">
  </form>

  <script>
    function validate() {
      var firstName = document.myForm.fname.value;
      var lastName = document.myForm.lname.value;
      var password = document.myForm.usrpassword.value;
      var mobile = document.myForm.usrmobile.value;

      if (firstName == '' || firstName.length < 3) {
        alert('First Name is invalid');
        return false;
      }

      if (lastName == '') {
        alert('Last Name is required');
        return false;
      }

      if (password.length < 6) {
        alert('Password must be at least 6 characters');
        return false;
      }

      if (isNaN(mobile)) {
        alert('Mobile number must be numeric');
        return false;
      }

      return true;
    }
  </script>
</body>
</html>
